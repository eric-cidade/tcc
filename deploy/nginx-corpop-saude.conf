# Site nginx da Busca Hibrida CorPop-Saude.
# Instalar em /etc/nginx/sites-available/corpop-saude e linkar em sites-enabled.
#
# Serve o frontend estatico e faz proxy da API na MESMA origem. E o que elimina
# o CORS: o navegador ve tudo em http://143.54.25.141/, entao /buscar nao e
# cross-origin e o front pode usar caminho relativo (API_BASE = "").

upstream corpop_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name 143.54.25.141;

    # O corpus e pequeno, mas as respostas de /buscar trazem as bulas COMPLETAS
    # (original + simplificada de cada resultado) e passam bem de 100KB.
    gzip on;
    gzip_types application/json text/css application/javascript text/html;
    gzip_min_length 1024;

    access_log /var/log/nginx/corpop-saude.access.log;
    error_log  /var/log/nginx/corpop-saude.error.log;

    # --- Frontend estatico ---
    root /opt/corpop-saude/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API (FastAPI/uvicorn) ---
    # Rotas explicitas em vez de um prefixo /api: o front chama /buscar direto, e
    # listar as rotas evita expor por acidente algo novo que a API venha a ter.
    # /embed fica DE FORA de proposito: e o endpoint que a indexacao usa para
    # reaproveitar o modelo carregado, e so deve ser alcancavel por loopback.
    location ~ ^/(buscar|simplicidade|config|health|docs|redoc|openapi\.json)$ {
        proxy_pass http://corpop_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uma busca faz encode da query na CPU e ainda calcula o trecho que casou
        # em cada resultado. Nos 4 vCPU do servidor isso passa dos 60s default do
        # nginx em consulta pesada — 120s evita 504 em requisicao que ia responder.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }
}
